name: Release validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned compiler from release settings
        shell: python
        run: |
          import os, pathlib, subprocess, tomllib
          version = tomllib.loads(pathlib.Path('tools/release/settings.toml').read_text())['release']['rust_version']
          target = '${{ matrix.target }}'
          toolchain = version + '-' + target
          subprocess.run(['rustup', 'toolchain', 'install', toolchain, '--profile', 'minimal', '--component', 'rustfmt', '--component', 'clippy'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('RUSTUP_TOOLCHAIN=' + toolchain + '\n')
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python -m unittest discover -s tools/release -p "test_*.py" -v
      - name: First clean build
        run: python tools/release/package.py --output dist/first --build-dir work/build-first
      - name: Independent second build
        run: python tools/release/package.py --output dist/second --build-dir work/build-second
      - name: Compare exact archive checksums
        shell: python
        run: |
          from pathlib import Path
          assert Path('dist/first/SHA256SUMS').read_bytes() == Path('dist/second/SHA256SUMS').read_bytes(), 'Independent build archives differ'
      - uses: actions/upload-artifact@v4
        with:
          name: carbon-${{ matrix.target }}
          path: dist/first/*
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: tools/release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: carbon-${{ matrix.target }}
          path: dist/received
      - name: Test downloaded package without compiler on runtime PATH
        run: python tools/release/smoke.py --artifacts dist/received --work work/smoke
      - name: Record smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}
          path: |
            work/smoke/**/result.json
            work/smoke/**/save-acceptance.json
          if-no-files-found: warn
          retention-days: 14
