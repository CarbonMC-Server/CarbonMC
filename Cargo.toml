[workspace]
resolver = "2"
members = [
    "crates/carbon-api",
    "crates/carbon-config",
    "crates/carbon-protocol",
    "crates/carbon-server",
    "extensions/hello-carbon",
]
default-members = ["crates/carbon-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-only"
repository = "https://github.com/iamvip4973-crypto/CarbonMC"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
md-5 = "0.10"
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
